<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nandoApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .login-page {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 15% 85%, rgba(203, 213, 225, 0.65), transparent 48%),
                linear-gradient(135deg, #f8fafc, #e2e8f0);
        }

        .login-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .tech-support {
            position: fixed;
            right: 20px;
            bottom: 16px;
            z-index: 10;
            max-width: calc(100vw - 32px);
            padding: 10px 14px;
            border: 1px solid rgba(203, 213, 225, 0.9);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #475569;
            font-size: 12px;
            line-height: 1.6;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(8px);
        }

        .tech-support-title {
            margin-bottom: 2px;
            color: #1e293b;
            font-weight: 700;
        }

        .tech-support a {
            color: #2563eb;
            text-decoration: none;
        }

        .tech-support a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .tech-support {
                right: 10px;
                bottom: 10px;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body class="login-page flex items-center justify-center min-h-screen">
    <canvas id="loginParticles" class="login-particles" aria-hidden="true"></canvas>

    <div id="loginCard" class="relative z-10 bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">nandoApp</h1>
            <p class="text-sm text-gray-500 mt-1"></p>
        </div>

        <!-- Alert Notifikasi Error -->
        <div id="alertBox" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded-lg"></div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username" 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password" 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm transition">
            </div>

            <button type="submit" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400">
                Masuk
            </button>
        </form>
    </div>

    <aside class="tech-support" aria-label="Informasi Tech Support">
        <div class="tech-support-title">Tech Support</div>
        <div>Whatsapp: <a href="https://wa.me/6281388183368" target="_blank" rel="noopener noreferrer">0813-8818-3368 (Fernando)</a></div>
        <div>Email: <a href="mailto:itfernandoo@gmail.com">itfernandoo@gmail.com</a></div>
    </aside>

    
    <!-- Script Integrasi API -->
    <script>
        const API_URL = '/api';
        const particleCanvas = document.getElementById('loginParticles');
        const particleContext = particleCanvas.getContext('2d');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const loginCard = document.getElementById('loginCard');
        const particles = [];
        const pointer = { x: -1000, y: -1000, active: false };
        const particleColors = [
            'rgba(96, 165, 250, 0.58)',
            'rgba(129, 140, 248, 0.48)',
            'rgba(148, 163, 184, 0.52)'
        ];
        let particleFrame = null;

        function resizeParticleCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            particleCanvas.width = Math.round(window.innerWidth * pixelRatio);
            particleCanvas.height = Math.round(window.innerHeight * pixelRatio);
            particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            const particleCount = Math.min(560, Math.max(180, Math.floor(window.innerWidth * window.innerHeight / 2400)));
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                const angle = i * goldenAngle;
                particles.push({
                    x: 0,
                    y: 0,
                    angle,
                    bandPhase: Math.random() * Math.PI * 2,
                    bandCycleSpeed: 0.012 + Math.random() * 0.006,
                    orbitSpeed: 0.0025 + Math.random() * 0.002,
                    dashLength: 3.5 + Math.random() * 3.5,
                    dashWidth: 1.8 + Math.random() * 1,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.025 + Math.random() * 0.045,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)]
                });
            }
            const cardBounds = loginCard.getBoundingClientRect();
            const centerX = cardBounds.left + cardBounds.width / 2;
            const centerY = cardBounds.top + cardBounds.height / 2;
            for (const particle of particles) {
                const bandRatio = 0.2 + 0.78 * (0.5 + 0.5 * Math.cos(particle.bandPhase));
                const band = 20 + getMaximumOrbitBand(particle.angle, cardBounds) * bandRatio;
                const orbitX = cardBounds.width / 2 + band;
                const orbitY = cardBounds.height / 2 + band;
                particle.x = centerX + Math.cos(particle.angle) * orbitX;
                particle.y = centerY + Math.sin(particle.angle) * orbitY;
            }
            drawParticles(false);
            if (!reducedMotion && particleFrame === null) {
                particleFrame = requestAnimationFrame(animateParticles);
            }
        }

        function drawParticles(animate) {
            particleContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
            const cardBounds = loginCard.getBoundingClientRect();
            const centerX = cardBounds.left + cardBounds.width / 2;
            const centerY = cardBounds.top + cardBounds.height / 2;
            for (const particle of particles) {
                if (animate) particle.angle += particle.orbitSpeed;
                if (animate) particle.bandPhase += particle.bandCycleSpeed;
                if (animate) particle.twinklePhase += particle.twinkleSpeed;

                const bandRatio = 0.2 + 0.78 * (0.5 + 0.5 * Math.cos(particle.bandPhase));
                const band = 20 + getMaximumOrbitBand(particle.angle, cardBounds) * bandRatio;
                const orbitX = cardBounds.width / 2 + band;
                const orbitY = cardBounds.height / 2 + band;
                const orbitTargetX = centerX + Math.cos(particle.angle) * orbitX;
                const orbitTargetY = centerY + Math.sin(particle.angle) * orbitY;
                let targetX = orbitTargetX;
                let targetY = orbitTargetY;

                if (pointer.active) {
                    const dx = orbitTargetX - pointer.x;
                    const dy = orbitTargetY - pointer.y;
                    const distance = Math.hypot(dx, dy);
                    const spreadRadius = 230;
                    if (distance < spreadRadius && distance > 0) {
                        const spread = (1 - distance / spreadRadius) * 58;
                        targetX += (dx / distance) * spread;
                        targetY += (dy / distance) * spread;
                    }
                }

                const followSpeed = reducedMotion ? 1 : 0.045;
                particle.x += (targetX - particle.x) * followSpeed;
                particle.y += (targetY - particle.y) * followSpeed;

                const twinkle = 0.55 + (Math.sin(particle.twinklePhase) + 1) * 0.225;
                const tangentX = -Math.sin(particle.angle) * orbitX;
                const tangentY = Math.cos(particle.angle) * orbitY;
                const tangentLength = Math.hypot(tangentX, tangentY) || 1;
                const halfDash = particle.dashLength / 2;
                particleContext.globalAlpha = twinkle;
                particleContext.strokeStyle = particle.color;
                particleContext.lineWidth = particle.dashWidth;
                particleContext.lineCap = 'round';
                particleContext.beginPath();
                particleContext.moveTo(
                    particle.x - (tangentX / tangentLength) * halfDash,
                    particle.y - (tangentY / tangentLength) * halfDash
                );
                particleContext.lineTo(
                    particle.x + (tangentX / tangentLength) * halfDash,
                    particle.y + (tangentY / tangentLength) * halfDash
                );
                particleContext.stroke();
            }
            particleContext.globalAlpha = 1;
        }

        function getMaximumOrbitBand(angle, cardBounds) {
            const centerX = cardBounds.left + cardBounds.width / 2;
            const centerY = cardBounds.top + cardBounds.height / 2;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            const margin = 14;
            const limits = [];

            if (cos > 0.001) limits.push((window.innerWidth - margin - centerX) / cos - cardBounds.width / 2);
            if (cos < -0.001) limits.push((centerX - margin) / -cos - cardBounds.width / 2);
            if (sin > 0.001) limits.push((window.innerHeight - margin - centerY) / sin - cardBounds.height / 2);
            if (sin < -0.001) limits.push((centerY - margin) / -sin - cardBounds.height / 2);

            return Math.max(16, Math.min(...limits));
        }

        function animateParticles() {
            drawParticles(true);
            particleFrame = requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeParticleCanvas);
        document.addEventListener('pointermove', event => {
            if (event.pointerType === 'touch') return;
            pointer.x = event.clientX;
            pointer.y = event.clientY;
            pointer.active = true;
            if (reducedMotion) drawParticles(false);
        });
        document.addEventListener('pointerleave', () => {
            pointer.active = false;
        });
        resizeParticleCanvas();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const btnLogin = document.getElementById('btnLogin');

            alertBox.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Memproses...';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    // Simpan token JWT & data user ke LocalStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Pindah ke halaman dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    alertBox.textContent = data.error || data.message || 'Login gagal! Periksa kembali akun Anda.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Gagal terhubung ke server backend Express!';
                alertBox.classList.remove('hidden');
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = 'Masuk';
            }
        });
    </script>
</body>
</html>
