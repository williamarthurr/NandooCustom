<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nandoApp</title>
    <link rel="stylesheet" href="tailwind.css">
    <style>
        .login-page {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 18% 24%, rgba(59, 130, 246, 0.2), transparent 42%),
                radial-gradient(ellipse at 82% 76%, rgba(129, 140, 248, 0.14), transparent 40%),
                linear-gradient(135deg, #080d1c, #111a31 52%, #090e20);
        }

        .login-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        .login-orbit {
            position: absolute;
            z-index: 1;
            width: min(82vw, 620px);
            height: min(72vh, 500px);
            min-height: 360px;
            border: 1px solid rgba(147, 197, 253, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: orbit-rotate 28s linear infinite;
        }

        .login-orbit::after {
            position: absolute;
            top: 50%;
            left: 0;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bfdbfe;
            box-shadow: 0 0 10px 2px rgba(96, 165, 250, 0.65);
            content: "";
            transform: translate(-50%, -50%);
        }

        .login-orbit--crossing {
            width: min(74vw, 560px);
            height: min(86vh, 600px);
            min-height: 400px;
            border-color: rgba(196, 181, 253, 0.16);
            animation: orbit-rotate-reverse 36s linear infinite;
        }

        .login-orbit--crossing::after {
            width: 6px;
            height: 6px;
            background: #ddd6fe;
            box-shadow: 0 0 12px 3px rgba(167, 139, 250, 0.7);
        }

        @keyframes orbit-rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes orbit-rotate-reverse {
            to {
                transform: rotate(-360deg);
            }
        }

        @media (max-width: 480px) {
            .login-orbit {
                width: 104vw;
                height: 400px;
                min-height: 0;
            }

            .login-orbit--crossing {
                width: 92vw;
                height: 470px;
                min-height: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-orbit,
            .login-orbit--crossing {
                animation: none;
            }
        }

        .login-splash {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(6, 10, 24, 0.88);
            color: #f8fafc;
            opacity: 0;
            visibility: hidden;
            backdrop-filter: blur(12px);
            transition: opacity 350ms ease, visibility 350ms ease;
        }

        .login-splash.is-visible {
            opacity: 1;
            visibility: visible;
        }

        .login-splash__content {
            text-align: center;
            animation: splash-arrive 500ms ease both;
        }

        .login-splash__mark {
            position: relative;
            display: block;
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.22), transparent 68%);
        }

        .login-splash__mark::before,
        .login-splash__mark::after {
            position: absolute;
            inset: 12px 0;
            border: 1px solid rgba(191, 219, 254, 0.55);
            border-radius: 50%;
            content: "";
            transform: rotate(-32deg);
        }

        .login-splash__mark::before {
            border-color: rgba(196, 181, 253, 0.42);
            transform: rotate(32deg);
        }

        .login-splash__planet {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #bfdbfe;
            box-shadow: 0 0 16px 4px rgba(96, 165, 250, 0.55);
            transform: translate(-50%, -50%);
        }

        .login-splash__satellite {
            position: absolute;
            top: 50%;
            left: 0;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ddd6fe;
            box-shadow: 0 0 12px 3px rgba(167, 139, 250, 0.7);
            transform: translate(-50%, -50%);
            animation: splash-satellite-orbit 5s linear infinite;
        }

        .login-splash__title {
            margin: 0;
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .login-splash__message {
            margin: 10px 0 0;
            color: #cbd5e1;
            font-size: 14px;
        }

        .login-splash__loading {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 28px;
        }

        .login-splash__loading span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #93c5fd;
            animation: splash-pulse 1s ease-in-out infinite alternate;
        }

        .login-splash__loading span:nth-child(2) {
            animation-delay: 150ms;
        }

        .login-splash__loading span:nth-child(3) {
            animation-delay: 300ms;
        }

        @keyframes splash-arrive {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes splash-satellite-orbit {
            to {
                transform: rotate(360deg) translateX(36px) rotate(-360deg);
            }
        }

        @keyframes splash-pulse {
            to {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-splash,
            .login-splash__content {
                animation: none;
                transition: none;
            }

            .login-splash__satellite,
            .login-splash__loading span {
                animation: none;
            }
        }

        .tech-support {
            position: fixed;
            right: 20px;
            bottom: 16px;
            z-index: 10;
            max-width: calc(100vw - 32px);
            padding: 10px 14px;
            border: 1px solid rgba(203, 213, 225, 0.9);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #475569;
            font-size: 12px;
            line-height: 1.6;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(8px);
        }

        .tech-support-title {
            margin-bottom: 2px;
            color: #1e293b;
            font-weight: 700;
        }

        .tech-support a {
            color: #2563eb;
            text-decoration: none;
        }

        .tech-support a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .tech-support {
                right: 10px;
                bottom: 10px;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body class="login-page flex items-center justify-center min-h-screen">
    <canvas id="loginParticles" class="login-particles" aria-hidden="true"></canvas>
    <div class="login-orbit" aria-hidden="true"></div>
    <div class="login-orbit login-orbit--crossing" aria-hidden="true"></div>

    <div id="loginCard" class="relative z-10 bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">nandoApp</h1>
            <p class="text-sm text-gray-500 mt-1"></p>
        </div>

        <!-- Alert Notifikasi Error -->
        <div id="alertBox" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded-lg"></div>

        <!-- Form Login -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username" 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password" 
                    class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none text-sm transition">
            </div>

            <button type="submit" id="btnLogin" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400">
                Masuk
            </button>
        </form>
    </div>

    <aside class="tech-support" aria-label="Informasi Tech Support">
        <div class="tech-support-title">Tech Support</div>
        <div>Whatsapp: <a href="https://wa.me/6281388183368" target="_blank" rel="noopener noreferrer">0813-8818-3368 (Fernando)</a></div>
        <div>Email: <a href="mailto:itfernandoo@gmail.com">itfernandoo@gmail.com</a></div>
    </aside>

    <div id="loginSplash" class="login-splash" aria-hidden="true">
        <div class="login-splash__content" role="status" aria-live="polite">
            <div class="login-splash__mark" aria-hidden="true">
                <span class="login-splash__planet"></span>
                <span class="login-splash__satellite"></span>
            </div>
            <h2 id="loginSplashTitle" class="login-splash__title">Selamat datang</h2>
            <p class="login-splash__message">Menyiapkan ruang kerjamu...</p>
            <div class="login-splash__loading" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    
    <!-- Script Integrasi API -->
    <script>
        const API_URL = '/api';
        const particleCanvas = document.getElementById('loginParticles');
        const particleContext = particleCanvas.getContext('2d');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const particles = [];
        const particleColors = [
            '148, 163, 184',
            '191, 219, 254',
            '199, 210, 254'
        ];
        let particleFrame = null;

        function resizeParticleCanvas() {
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            particleCanvas.width = Math.round(window.innerWidth * pixelRatio);
            particleCanvas.height = Math.round(window.innerHeight * pixelRatio);
            particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            const particleCount = Math.min(100, Math.max(45, Math.floor(window.innerWidth * window.innerHeight / 14000)));
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: 0.5 + Math.random() * 0.8,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.008 + Math.random() * 0.018,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)]
                });
            }
            drawParticles(false);
            if (!reducedMotion && particleFrame === null) {
                particleFrame = requestAnimationFrame(animateParticles);
            }
        }

        function drawParticles(animate) {
            particleContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
            for (const particle of particles) {
                if (animate) particle.twinklePhase += particle.twinkleSpeed;
                const twinkle = 0.28 + (Math.sin(particle.twinklePhase) + 1) * 0.2;
                particleContext.beginPath();
                particleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                particleContext.fillStyle = `rgba(${particle.color}, ${twinkle})`;
                particleContext.fill();
            }
        }

        function animateParticles() {
            drawParticles(true);
            particleFrame = requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeParticleCanvas);
        resizeParticleCanvas();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const btnLogin = document.getElementById('btnLogin');

            alertBox.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = 'Memproses...';
            let redirecting = false;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (response.ok) {
                    // Simpan token JWT & data user ke LocalStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    const splash = document.getElementById('loginSplash');
                    const splashTitle = document.getElementById('loginSplashTitle');
                    splashTitle.textContent = `Selamat datang, ${data.user?.nama || usernameInput}`;
                    splash.setAttribute('aria-hidden', 'false');
                    splash.classList.add('is-visible');
                    redirecting = true;
                    window.setTimeout(
                        () => window.location.assign('/dashboard.html'),
                        reducedMotion ? 700 : 1600
                    );
                } else {
                    alertBox.textContent = data.error || data.message || 'Login gagal! Periksa kembali akun Anda.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Gagal terhubung ke server backend Express!';
                alertBox.classList.remove('hidden');
            } finally {
                if (!redirecting) {
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Masuk';
                }
            }
        });
    </script>
</body>
</html>
