<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - nandoApp</title>
    <link rel="stylesheet" href="tailwind.css">
    <!-- Custom CSS Separated -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header / Topbar -->
    <header class="relative z-20 bg-indigo-700 text-white shadow-lg">
        <div class="w-full px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl font-bold tracking-wide">nandoApp</h1>
                <span id="userRole" class="bg-indigo-900 text-indigo-200 text-xs font-semibold px-2.5 py-1 rounded-full uppercase">user</span>
            </div>
            <div class="flex items-center space-x-4">
                <label for="languageSelector" class="sr-only">Language</label>
                <select id="languageSelector" aria-label="Pilih bahasa" class="rounded-lg border border-indigo-400 bg-indigo-800 px-2.5 py-1.5 text-xs font-semibold text-white focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="id">Indonesia</option>
                    <option value="en">English</option>
                </select>
                <span id="userName" class="text-sm font-medium">Selamat Datang, User</span>
                <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3.5 py-2 rounded-lg font-semibold transition shadow">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs Modul -->
    <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
        <div class="w-full px-6 flex space-x-2 relative">
            
            <!-- Dropdown Modul Master Data -->
            <div class="relative dropdown-container py-2 hidden" id="masterContainer">
                <button type="button" id="tab-master" class="tab-btn inactive-tab py-2 px-4 text-sm font-semibold flex items-center gap-1 border-b-2 focus:outline-none cursor-pointer">
                    📁 Master <span class="text-xs">▼</span>
                </button>
                
                <div id="masterDropdownMenu" class="dropdown-menu bg-white border border-gray-200 rounded-lg shadow-xl py-1">
                    <a href="dashboard.html?tab=master-user" target="_blank" rel="noopener noreferrer" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium block">User</a>
                    <a href="dashboard.html?tab=master-barang" target="_blank" rel="noopener noreferrer" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium block">Barang</a>
                    <a href="dashboard.html?tab=master-supplier" target="_blank" rel="noopener noreferrer" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium block">Supplier</a>
                    <a href="dashboard.html?tab=master-pelanggan" target="_blank" rel="noopener noreferrer" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 font-medium block">Pelanggan</a>
                </div>
            </div>

            <a href="dashboard.html?tab=stokin" target="_blank" rel="noopener noreferrer" id="tab-stokin" class="tab-btn inactive-tab py-3.5 px-4 text-sm font-semibold flex items-center gap-2 border-b-2">
                Stok In 
            </a>
            <a href="dashboard.html?tab=pos" target="_blank" rel="noopener noreferrer" id="tab-pos" class="tab-btn inactive-tab py-3.5 px-4 text-sm font-semibold flex items-center gap-2 border-b-2">
                Penjualan
            </a>
            <a href="dashboard.html?tab=inventory" target="_blank" rel="noopener noreferrer" id="tab-inventory" class="tab-btn inactive-tab py-3.5 px-4 text-sm font-semibold flex items-center gap-2 border-b-2">
                Inventory
            </a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="relative z-10 max-w-7xl mx-auto px-6 py-6 flex-1 w-full">
        <p id="moduleLoadError" class="hidden rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert"></p>
        <div id="moduleContent" class="contents">
            <p class="text-sm text-gray-500">Memuat dashboard...</p>
        </div>
    </main>

    <script src="i18n.js" defer></script>
    <script src="dashboard-loader.js" defer></script>
</body>
</html>
